<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Console Prototype</title>
<style>
:root {
  --bg: #0d0b0a; --panel: #1b1816; --panel-2: #24201d; --edge: #3a322c; --edge-hi: #5a4c40;
  --ink: #e9dfd0; --ink-dim: #cdbfa9; --brass: #d9b07a; --red: #c8332b; --red-hi: #ff5a4a;
  --amber: #ffb347; --cream: #e8dcc0; --phos: #6dff6d; --wood: #5a3320;
  --font: "Bahnschrift", "Segoe UI Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--font); }
/* Stand-in for the YTM page behind the drawer */
.page { position: fixed; inset: 0; display: grid; place-items: center; color: #444; font-size: 14px;
  background: radial-gradient(circle at 50% 30%, #1a1412, #050404); letter-spacing: .1em; }
.tab { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 3; padding: 6px 22px 8px;
  border: 1px solid var(--edge-hi); border-bottom: 0; border-radius: 10px 10px 0 0; cursor: pointer;
  background: linear-gradient(#2c2622, #1b1816); color: var(--brass); font: 700 12px var(--font); letter-spacing: .2em; }
.tab:hover { color: var(--amber); }
.drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; height: 330px; transform: translateY(100%);
  transition: transform .35s cubic-bezier(.2,.8,.2,1); display: grid; grid-template-columns: 24px 1fr 24px;
  background: url(tex/metal.jpg) 0 0 / 256px 256px, #14110f; border-top: 2px solid var(--edge-hi); box-shadow: 0 -12px 40px #000c; }
.drawer.open { transform: none; }
.drawer.open ~ .tab { bottom: 330px; transition: bottom .35s cubic-bezier(.2,.8,.2,1); }
.tab { transition: bottom .35s cubic-bezier(.2,.8,.2,1); }
.wood { background: url(tex/wood.jpg) center / 100% 100% no-repeat, #3a2012; box-shadow: inset 0 0 10px #000b, inset 0 0 0 1px #0006; }
.drawer > .wood:last-child { transform: scaleX(-1); }
.console { display: grid; grid-template-columns: auto minmax(0, 520px) minmax(0, 1fr) auto; gap: 8px; padding: 8px; min-width: 0; }
.switches.fill .btn { flex: 1; width: auto !important; height: 26px; font-size: 10px; }
.switches.fill { margin: 8px 0 0; }
.modes { display: flex; gap: 6px; margin: 4px 0 14px; }
.modes .btn { flex: 1; width: auto; height: 26px; }
.knobs { display: flex; justify-content: space-around; align-items: flex-end; margin-bottom: 14px; }
.slot { margin-top: auto; height: 64px; border: 1px dashed var(--edge-hi); border-radius: 6px; display: grid; place-items: center;
  font-size: 10px; letter-spacing: .2em; color: var(--ink-dim); }
.section.mod { display: flex; flex-direction: column; }
@media (max-width: 1500px) { .section.mod { display: none; } .console { grid-template-columns: auto minmax(0, 1fr) auto; } }
.section { position: relative; padding: 8px; border: 1px solid #0009; border-radius: 6px;
  background: linear-gradient(#ffffff0d, transparent 30%, #0006), url(tex/metal.jpg) 0 0 / 256px 256px; box-shadow: inset 0 1px 0 #ffffff14, inset 0 0 18px #000a, 0 2px 4px #000a; }
.screw { position: absolute; width: 10px; height: 10px; background: url(tex/screw.png) center / 100% 100% no-repeat; filter: drop-shadow(0 1px 1px #000c); }
.screw.tl { top: 3px; left: 3px } .screw.tr { top: 3px; right: 3px } .screw.bl { bottom: 3px; left: 3px } .screw.br { bottom: 3px; right: 3px }
.title { font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; letter-spacing: .22em; color: #f0c88e; margin: 0 0 6px 12px; text-transform: uppercase; }

/* Channels */
.channels { display: flex; gap: 6px; }
.strip { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; }
.strip .name { width: 70px; text-align: center; padding: 6px 0 5px; background: url(tex/label.png) center / 100% 100% no-repeat;
  color: #2a241c; font-weight: 800; font-size: 12px; letter-spacing: .12em; filter: drop-shadow(0 1px 2px #000a); }
.btns { display: flex; gap: 4px; }
.btn { --src: url(tex/btn-cream.png); position: relative; width: 38px; height: 22px; padding: 0; cursor: pointer;
  border: 6px solid transparent; border-image: var(--src) 16 fill / 6px stretch; background: none; box-sizing: border-box;
  font: 800 9px/10px var(--font); letter-spacing: .06em; color: #2a241c; filter: drop-shadow(0 2px 1px #000a); }
.btn.mute { --src: url(tex/btn-red.png); color: #ffe9e4; text-shadow: 0 1px 1px #000a; }
.btn.on, .btn:active { --src: url(tex/btn-cream-down.png); transform: translateY(1px); filter: drop-shadow(0 1px 0 #000a); }
.btn.mute.on, .btn.mute:active { --src: url(tex/btn-red-down.png); }
.btn.solo.on { filter: drop-shadow(0 0 7px #ffb347); }
.btn.mute.on { filter: drop-shadow(0 0 7px #ff5a4a); }
.fader-wrap { display: flex; gap: 6px; height: 160px; }
.scale { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; text-shadow: 0 1px 1px #000; color: var(--ink-dim); text-align: right; padding: 2px 0; }
.track { position: relative; width: 10px; border-radius: 5px; background: #050404; box-shadow: inset 0 0 4px #000, 0 1px 0 #ffffff14; touch-action: none; cursor: ns-resize; }
.cap { position: absolute; left: 50%; width: 24px; height: 46px; transform: translate(-50%, 50%); border-radius: 3px;
  background: url(tex/cap-cream.png) center / 100% 100% no-repeat; box-shadow: 0 3px 5px #000c; }
.cap.red { background-image: url(tex/cap-red.png); }
.led-meter { display: flex; flex-direction: column-reverse; gap: 2px; width: 7px; padding: 1px; background: #050404; border-radius: 2px; }
.led-meter i { flex: 1; border-radius: 1px; background: #1c1916; }
.led-meter i.g.on { background: #51e36a; box-shadow: 0 0 4px #51e36a; }
.led-meter i.y.on { background: #ffd24a; box-shadow: 0 0 4px #ffd24a; }
.led-meter i.r.on { background: #ff4a3a; box-shadow: 0 0 5px #ff4a3a; }

/* Knobs */
.knob-box { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--ink-dim); letter-spacing: .12em; text-shadow: 0 1px 2px #000; }
.knob { position: relative; width: 38px; height: 38px; cursor: ns-resize; touch-action: none;
  background: url(tex/knob-cream.png) center / 100% 100% no-repeat; filter: drop-shadow(0 3px 3px #000b); }
.knob::after { content: ""; position: absolute; left: 50%; top: 8px; width: 2.5px; height: 10px; margin-left: -1.25px;
  background: url(tex/pointer.png) center / 100% 100% no-repeat; transform-origin: 50% 11px; transform: rotate(var(--a, 0deg)); }
.knob:not(.red):not(.blue):not(.big)::after { filter: brightness(.12) contrast(1.2); }
.knob.red { background-image: url(tex/knob-red.png); }
.knob.blue { background-image: url(tex/knob-blue.png); }
.knob.big { width: 62px; height: 62px; background-image: url(tex/knob-master.png); }
.knob.big::after { top: 12px; width: 4px; height: 17px; margin-left: -2px; transform-origin: 50% 19px; }

/* EQ / VU */
.eq-screen { width: 100%; height: 150px; border-radius: 6px; display: block; background: #031003;
  box-shadow: inset 0 0 22px #000, 0 0 0 2px #0a0f0a, 0 0 0 3px var(--edge); }
.switches { display: flex; gap: 6px; margin: 6px 0 0 4px; flex-wrap: wrap; }
.vus { display: flex; gap: 8px; margin-bottom: 8px; }
.vu { width: 128px; height: 80px; border-radius: 4px; position: relative; overflow: hidden;
  background: url(tex/vu-face.png) center / 100% 100% no-repeat; box-shadow: inset 0 0 14px #000a, 0 0 0 2px #0a0807, 0 0 0 3px var(--edge); }
.vu .nd { position: absolute; left: 50%; bottom: -24.4%; width: 2px; height: 107%; margin-left: -1px; border-radius: 1px;
  background: linear-gradient(#1a1208, #3a2a10); transform-origin: 50% 100%; box-shadow: 3px 2px 3px #0005; }
.vu .lbl { position: absolute; font: 800 12px var(--font); color: #3a2a10; letter-spacing: .1em; }
.vu::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, #ffffff38, transparent 38%); pointer-events: none; }
.master { display: flex; flex-direction: column; gap: 8px; width: 190px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: #3a2a14; display: inline-block; margin-right: 4px; }
.led.on { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.row { display: flex; gap: 12px; align-items: flex-end; justify-content: center; }
.status { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; letter-spacing: .14em; color: var(--ink-dim); padding: 0 6px; }
</style>
</head>
<body>
<div class="page">YOUTUBE MUSIC PAGE (stand-in)</div>

<div class="drawer" id="drawer">
  <div class="wood"></div>
  <div class="console">
    <section class="section">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <h3 class="title">Stems</h3>
      <div class="channels" id="channels"></div>
    </section>

    <section class="section" style="min-width:0">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <h3 class="title">Equalizer</h3>
      <canvas class="eq-screen" id="eq" width="900" height="300"></canvas>
      <div class="switches fill">
        <button class="btn solo on" id="eqon">EQ ON</button>
        <button class="btn">FLAT</button>
        <button class="btn">BASS BOOST</button>
        <button class="btn">VOCAL</button>
        <button class="btn">SAVE</button>
      </div>
    </section>

    <section class="section mod">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <h3 class="title">Enhancer <span style="opacity:.5">· idea</span></h3>
      <div class="modes">
        <button class="btn">OFF</button><button class="btn solo on">ANALOG</button><button class="btn">VINYL</button><button class="btn">TAPE</button>
      </div>
      <div class="knobs">
        <div class="knob-box"><div class="knob" data-v="0.5"></div>DRIVE</div>
        <div class="knob-box"><div class="knob blue" data-v="0.4"></div>WARMTH</div>
        <div class="knob-box"><div class="knob" data-v="0.6"></div>AIR</div>
        <div class="knob-box"><div class="knob red" data-v="0.3"></div>WIDTH</div>
      </div>
      <div class="slot">EMPTY MODULE SLOT</div>
    </section>

    <section class="section">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <h3 class="title">Output</h3>
      <div class="vus" id="vus"></div>
      <div class="master">
        <div class="row">
          <div class="knob-box"><div class="knob red big" data-v="0.5"></div>MASTER</div>
          <div class="knob-box"><div class="knob" data-v="0.8"></div>THRESH</div>
        </div>
        <div class="switches" style="margin:0 0 0 4px">
          <button class="btn solo" id="lim" style="width:80px"><span class="led" id="limled"></span>LIMITER</button>
        </div>
      </div>
    </section>

    <div class="status"><span>MODEL: HT-DEMUCS</span><span>BUFFER OK · LATENCY 1.8 s</span><span>UNDERRUNS 0</span></div>
  </div>
  <div class="wood"></div>
</div>
<button class="tab" id="tab">STUDIO ▲</button>

<script>
const $ = (s, r = document) => r.querySelector(s);
const drawer = $('#drawer'), tab = $('#tab');
tab.onclick = () => { drawer.classList.toggle('open'); tab.textContent = drawer.classList.contains('open') ? 'STUDIO ▼' : 'STUDIO ▲'; };
setTimeout(() => tab.click(), 300);

// Stem channels
const stems = [['VOCALS', ''], ['DRUMS', 'red'], ['BASS', ''], ['OTHER', 'red']];
const chWrap = $('#channels'), meters = [];
for (const [name, cap] of stems) {
  const el = document.createElement('div'); el.className = 'strip';
  const marks = ['+10', '0', '-10', '-20', '-40', '-∞'].map((m) => `<span>${m}</span>`).join('');
  el.innerHTML = `<div class="btns"><button class="btn solo">SOLO</button><button class="btn mute">MUTE</button></div>
    <div class="fader-wrap"><div class="scale">${marks}</div><div class="track"><div class="cap ${cap}"></div></div>
    <div class="led-meter">${Array.from({ length: 16 }, (_, i) => `<i class="${i > 12 ? 'r' : i > 9 ? 'y' : 'g'}"></i>`).join('')}</div></div>
    <div class="name">${name}</div>`;
  chWrap.appendChild(el);
  for (const b of el.querySelectorAll('.btn')) b.onclick = () => b.classList.toggle('on');
  const track = $('.track', el), capEl = $('.cap', el); let v = 0.7;
  const set = (x) => { v = Math.min(1, Math.max(0, x)); capEl.style.bottom = (v * 100) + '%'; }; set(v);
  track.onpointerdown = (e) => { track.setPointerCapture(e.pointerId); mv(e); };
  const mv = (e) => { if (!track.hasPointerCapture(e.pointerId)) return; const r = track.getBoundingClientRect(); set(1 - (e.clientY - r.top) / r.height); };
  track.onpointermove = mv;
  meters.push({ leds: [...el.querySelectorAll('.led-meter i')], get gain() { return v; } });
}

// Knobs: vertical drag
for (const k of document.querySelectorAll('.knob')) {
  let v = Number(k.dataset.v ?? 0.5); const draw = () => k.style.setProperty('--a', (-135 + v * 270) + 'deg'); draw();
  k.onpointerdown = (e) => { k.setPointerCapture(e.pointerId); k._y = e.clientY; k._v = v; };
  k.onpointermove = (e) => { if (!k.hasPointerCapture(e.pointerId)) return; v = Math.min(1, Math.max(0, k._v + (k._y - e.clientY) / 150)); draw(); };
}
$('#lim').onclick = (e) => { e.currentTarget.classList.toggle('on'); $('#limled').classList.toggle('on', e.currentTarget.classList.contains('on')); };
$('#eqon').onclick = (e) => e.currentTarget.classList.toggle('on');

// VU meters
const vus = $('#vus'); const needles = [];
for (const label of ['L', 'R']) {
  const d = document.createElement('div'); d.className = 'vu';
  d.innerHTML = `<span class="lbl" style="left:8px;bottom:6px">${label}</span><span class="lbl" style="left:50%;bottom:26%;transform:translateX(-50%);font-size:15px">VU</span><i class="nd"></i>`;
  vus.appendChild(d); needles.push($('.nd', d));
}

// EQ screen with fake spectrum + curve
const cv = $('#eq'), g = cv.getContext('2d');
const pts = [[80, 4], [250, -2], [1000, 0], [3000, 3], [8000, 4], [12000, 2]];
const xOf = (f) => 30 + (Math.log10(f / 20) / 3) * (cv.width - 40), yOf = (db) => cv.height / 2 - db * 8;
function frame(t) {
  g.clearRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#0f3a0f'; g.lineWidth = 1;
  for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) { g.beginPath(); g.moveTo(xOf(f), 0); g.lineTo(xOf(f), cv.height); g.stroke(); }
  for (let d = -15; d <= 15; d += 5) { g.beginPath(); g.moveTo(30, yOf(d)); g.lineTo(cv.width, yOf(d)); g.stroke(); }
  g.fillStyle = '#1d6a1d88';
  for (let i = 0; i < 90; i++) {
    const x = 30 + (i / 90) * (cv.width - 40), h = (Math.sin(t / 500 + i * 0.3) * .5 + .5) * (140 - i) * (1.4 - i / 120) * .9 + 10;
    g.fillRect(x, cv.height - h, (cv.width - 40) / 90 - 1, h);
  }
  g.strokeStyle = '#6dff6d'; g.shadowColor = '#6dff6d'; g.shadowBlur = 10; g.lineWidth = 3; g.beginPath();
  for (let x = 30; x < cv.width; x += 4) {
    const f = 20 * 10 ** (((x - 30) / (cv.width - 40)) * 3); let db = 0;
    for (const [pf, pg] of pts) db += pg * Math.exp(-((Math.log2(f / pf)) ** 2) / 1.2);
    x === 30 ? g.moveTo(x, yOf(db)) : g.lineTo(x, yOf(db));
  }
  g.stroke(); g.shadowBlur = 0;
  pts.forEach(([f, db], i) => { g.fillStyle = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'][i]; g.beginPath(); g.arc(xOf(f), yOf(db), 7, 0, 7); g.fill(); });
  // demo levels
  meters.forEach((m, i) => { const lvl = (Math.sin(t / 260 + i * 1.7) * .5 + .5) * m.gain; m.leds.forEach((l, j) => l.classList.toggle('on', j < lvl * 16)); });
  needles.forEach((n, i) => { const a = -39 + (Math.sin(t / 300 + i) * .5 + .5) * 78; n.style.transform = `rotate(${a}deg)`; });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
