<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Method A capture control</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #111827; color: #e5e7eb; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { color: #cbd5e1; line-height: 1.45; }
    label { display: block; margin: 18px 0 8px; }
    select, button { box-sizing: border-box; width: 100%; padding: 11px; border-radius: 6px; font: inherit; }
    select { background: #1f2937; color: inherit; border: 1px solid #475569; }
    button { margin-top: 10px; border: 0; background: #2563eb; color: white; font-weight: 650; cursor: pointer; }
    button.secondary { background: #475569; }
    button:disabled { opacity: .55; cursor: default; }
    #status { min-height: 42px; padding: 10px; background: #1f2937; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Method A audio capture</h1>
  <p>Capture the YouTube Music tab audio and immediately stop its video track. Start playback manually in the YTM window only when you are ready to measure.</p>
  <label for="variant">Capture variant</label>
  <select id="variant">
    <option value="local_echo_disabled">enableLocalEcho: false</option>
    <option value="webcontents_muted">YTM webContents.setAudioMuted(true)</option>
  </select>
  <button id="start">Start A capture</button>
  <button id="stop" class="secondary" disabled>Stop capture</button>
  <p id="status" role="status">Ready. No audio is captured until you start it.</p>
  <script src="capture-a.js"></script>
</body>
</html>
